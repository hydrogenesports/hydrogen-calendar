<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>HYDROGEN · Apple Calendar</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:#071426;
      color:#f3f8ff;
      font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:grid;
      place-items:center;
      padding:24px;
    }
    main{max-width:440px;text-align:center}
    h1{
      letter-spacing:.11em;
      font-size:30px;
      margin:0;
      color:#69b9ff;
    }
    p{color:#b9cfe7}
    a{
      display:inline-block;
      padding:14px 24px;
      border-radius:11px;
      background:#2583e5;
      color:#fff;
      text-decoration:none;
      font-weight:700;
      margin-top:12px;
    }
    small{
      display:block;
      margin-top:24px;
      color:#8cabcc;
    }
    .help{
      margin-top:27px;
      padding:16px 18px;
      border:1px solid rgba(105,185,255,.22);
      border-radius:14px;
      background:linear-gradient(
        135deg,
        rgba(37,131,229,.13),
        rgba(37,131,229,.035)
      );
      box-shadow:0 8px 30px rgba(0,0,0,.1);
    }
    .help-title{
      font-size:13px;
      letter-spacing:.06em;
      color:#b8daf7;
      font-weight:750;
      text-transform:uppercase;
      margin:0 0 5px;
    }
    .help-copy{
      font-size:14px;
      color:#9bb8d7;
      margin:0;
    }
    .help-link{
      display:inline;
      padding:0;
      margin:0;
      background:none;
      color:#69b9ff;
      border-radius:0;
      font-weight:700;
      text-decoration:underline;
      text-underline-offset:3px;
    }
    .help-link:hover{color:#a5d9ff}
    .footer{
      display:block;
      margin-top:26px;
      color:#8cabcc;
      font-size:11px;
      letter-spacing:.13em;
    }
  </style>
</head>
<body>
<main>
  <h1>HYDROGEN</h1>

  <p>Opening your Apple Calendar subscription…</p>

  <a id="subscribe"
     href="webcal://calendar.google.com/calendar/ical/f21e64908c8f727764f420d01a49213b5050f761664d99d43f037c41268cf415%40group.calendar.google.com/public/basic.ics">
    Subscribe with Apple Calendar
  </a>

  <div class="help">
    <p class="help-title">✦ Need a hand?</p>
    <p class="help-copy">
      Calendar didn't open?
      <a class="help-link" id="fallback"
         href="webcal://calendar.google.com/calendar/ical/f21e64908c8f727764f420d01a49213b5050f761664d99d43f037c41268cf415%40group.calendar.google.com/public/basic.ics">
        Tap here to subscribe
      </a>.
    </p>
  </div>

  <small class="footer">
    HYDROGEN · IGNITE THE IMPOSSIBLE
  </small>
</main>

<script>
  // Automatically attempt to open Apple Calendar.
  // If blocked, the manual subscription links remain available.
  window.addEventListener('load', function () {
    window.location.assign(
      document.getElementById('subscribe').href
    );
  });
</script>
</body>
</html>
