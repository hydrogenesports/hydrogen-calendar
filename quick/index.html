<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>HYDROGEN · Apple Calendar</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:28px 18px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#eef8ff;
    background:radial-gradient(ellipse at 50% 33%,#154878 0%,#0a213b 38%,#050e1e 76%,#030815 100%); }
  main { width:min(100%,500px); text-align:center; padding:24px 20px 30px; }
  .logo { width:min(100%,370px); height:auto; display:block; margin:0 auto 12px;
    filter:drop-shadow(0 0 22px rgba(19,152,255,.18)); }
  .status { color:#c5dcf3; font-size:15px; margin:10px 0 28px; }
  .help { padding:22px 20px; border:1px solid rgba(94,174,247,.30); border-radius:18px;
    background:linear-gradient(135deg,rgba(26,82,132,.36),rgba(5,25,50,.65));
    box-shadow:0 12px 45px rgba(0,0,0,.20); }
  .help-title { margin:0 0 6px; font-weight:750; letter-spacing:.06em; font-size:12px; color:#a8d8ff; }
  .help-copy { margin:0 0 17px; font-size:14px; color:#bed5ed; }
  .subscribe { display:block; width:100%; padding:14px 15px; background:#2583e5; border-radius:12px;
    color:white; font-size:15px; font-weight:750; text-decoration:none; box-shadow:0 5px 20px rgba(37,131,229,.2); }
  .subscribe:hover,.subscribe:focus-visible { background:#3b9bff; }
  footer { margin-top:32px; color:#83bce9; letter-spacing:.16em; font-size:10px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="HYDROGEN Esports logo">
  <p class="status">Opening your Apple Calendar subscription…</p>
  <section class="help" aria-label="Manual subscription">
    <p class="help-title">✦ NEED A HAND?</p>
    <p class="help-copy">Calendar didn't open automatically?</p>
    <a class="subscribe" id="subscribe" href="webcal://calendar.google.com/calendar/ical/f21e64908c8f727764f420d01a49213b5050f761664d99d43f037c41268cf415%40group.calendar.google.com/public/basic.ics">Tap here to subscribe</a>
  </section>
  <footer>HYDROGEN · IGNITE THE IMPOSSIBLE</footer>
</main>
<script>
  window.addEventListener('load', () => {
    window.location.assign(document.getElementById('subscribe').href);
  });
</script>
</body>
</html>
